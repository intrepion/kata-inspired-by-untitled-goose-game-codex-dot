name: Gameplay tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test gameplay rules
        run: node tests/game.test.js && node tests/controls.test.js
